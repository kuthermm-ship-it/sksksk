              else if(p.en>=p.hs.sp.cost+30&&bd<80&&p.aic%90===0)i.pc=1;}
            else if(lead&&lead!==p){dx=lead.x-p.x;if(Math.abs(dx)>50+L.pl.indexOf(p)*14)i[dx>0?'r':'l']=1;}
            if((i.r||i.l)&&p.hitW&&p.onGround){i.pb=1;i.b=1;}
            if(lead&&lead.y<p.y-30&&p.onGround&&p.aic%30===0){i.pb=1;i.b=1;}
            return i;}
          function startAtk(p,s){p.state='atk';p.at={s:s,t:0,r:p.hs.rate[s],hit:[],buf:false};p.vx=p.dir*1.2;}
          function startSpec(L,p){var sp=p.hs.sp;p.state='spec';p.st=0;p.hl=[];p.en-=sp.cost;p.inv=Math.max(p.inv,34);p.vx=0;ILA.sfx('big');pop(L,p.x-14,p.y-12,sp.name,'#ffd34a');}
