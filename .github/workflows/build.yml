      - name: P6a - net.js (multiplayer)
        run: |
          cat > ilarion/www/js/net.js << 'EOF'
          (function(){
          var ILA=window.ILA,W=ILA.W,H=ILA.H,S=ILA.story,PORT=8765,IDN=0;
          var net={role:null,slots:[],act:[],ws:null,me:0,hero:null,running:false,lobby:[],msg:'',ip:[],stage:0,snap:null};
          ILA.net=net;
          var STG=[
          {n:'CITY RAID',o:{th:'city',w:2000,amb:'ash',title:['غارة المدينة','CITY RAID'],waves:[[400,'gg'],[800,'ggt'],[1250,'gwg'],[1650,'ggtw']],plat:[[600,160,100],[1300,160,100]]}},
          {n:'RUINS OF WAR',o:{th:'ruin',w:2000,amb:'embers',title:['أطلال الحرب','RUINS OF WAR'],waves:[[400,'ww'],[800,'wwc'],[1200,'wwt']],boss:{x:1500,t:'drakon',hp:520}}},
          {n:'THE VOID',o:{th:'void',w:2000,amb:'void',title:['الفراغ','THE VOID'],waves:[[400,'rr'],[800,'rrc'],[1200,'rrt']],boss:{x:1500,t:'azrael',hp:560}}},
          {n:'SKY WAR',o:{th:'sky',w:2200,amb:'ash',title:['الحرب فوق السماء','SKY WAR'],waves:[[400,'ggg'],[800,'gggw'],[1250,'ggwr']],boss:{x:1700,t:'seraphon',hp:560},plat:[[600,160,100],[1300,160,100]]}}
          ];
          function stageDef(i,n){var o={},k,s=STG[i].o;for(k in s)o[k]=s[k];o.hm=1+.6*(n-1);return S.lv(o);}
          function srv(){return window.cordova&&window.cordova.plugins&&window.cordova.plugins.wsserver;}
          function sendTo(sl,s){try{srv().send({uuid:sl.uuid},s);}catch(e){}}
          function bc(m){var s=JSON.stringify(m);net.slots.forEach(function(sl){if(!sl.gone)sendTo(sl,s);});}
          function r1(v){return Math.round(v*10)/10;}
          function sid(o){return o._i||(o._i=++IDN);}
          function nm(id){return ILA.chars[id]?ILA.chars[id].en:'';}
          /* ---- host: snapshot ---- */
          function snap(L){
            return {t:'s',sc:L.score,o:L.over,d:L.done,g:L.goT,lr:L.lockR,pz:L.paused?1:0,
              p:L.pl.map(function(p){return {i:p.id,x:r1(p.x),y:r1(p.y),d:p.dir,hp:p.hp,mh:p.mhp,en:Math.round(p.en),s:p.state,st:p.st,t:p.t,v:p.inv,vx:r1(p.vx),vy:r1(p.vy),g:p.onGround?1:0,a:p.at?[p.at.s,p.at.t,p.at.r]:0};}),
              e:L.en.map(function(e){return {i:sid(e),t:e.t,x:r1(e.x),y:r1(e.y),w:e.w,h:e.h,vx:r1(e.vx),d:e.dir,hp:e.hp,mh:e.mhp,s:e.state,st:e.st,tt:e.tt,f:e.fl,b:e.boss?e.bt:0,og:e.onGround?1:0,p2:e.ph2?1:0};}),
              r:L.pr.map(function(p){return {i:sid(p),x:r1(p.x),y:r1(p.y),w:p.w,h:p.h,vx:r1(p.vx),k:p.kind,c:p.col};}),
              z:L.hz.map(function(z){return {x:z.x,w:z.w,t:z.t,wa:z.warn,li:z.live,c:z.col};}),
              k:L.pk.map(function(k){return {i:sid(k),x:k.x,y:k.y,k:k.k,t:k.t};})};
          }
          /* ---- host: remote players use network input ---- */
          var oa=ILA._pl.aiInput;
          ILA._pl.aiInput=function(L,p){
            var r=p.remote;if(!r)return oa(L,p);
            var q=r.rin,o={l:q.l,r:q.r,u:q.u,d:q.d,a:q.a,b:q.b,c:q.c,x:q.x,pa:q.pa,pb:q.pb,pc:q.pc,px:q.px};
            q.pa=q.pb=q.pc=q.px=0;return o;
          };
          function slotOf(conn){for(var i=0;i<net.slots.length;i++)if(net.slots[i].uuid===conn.uuid)return net.slots[i];return null;}
          function lobbyBc(){var l=[net.hero];net.slots.forEach(function(s){if(s.hero)l.push(s.hero);});net.lobby=l;bc({t:'lobby',p:l});}
          function onOpen(conn){
            if(net.slots.filter(function(s){return !s.gone;}).length>=3){try{srv().send({uuid:conn.uuid},JSON.stringify({t:'full'}));}catch(e){}return;}
            net.slots.push({uuid:conn.uuid,hero:null,gone:0,rin:{l:0,r:0,u:0,d:0,a:0,b:0,c:0,x:0,pa:0,pb:0,pc:0,px:0}});
          }
          function onMsg(conn,msg){
            var m,sl=slotOf(conn);if(!sl)return;
            try{m=JSON.parse(msg);}catch(e){return;}
            if(m.t==='join'){
              var used=[net.hero];net.slots.forEach(function(s){if(s.hero)used.push(s.hero);});
              var h=m.hero;if(!h||used.indexOf(h)>=0||ILA.HEROES.indexOf(h)<0)h=ILA.HEROES.filter(function(x){return used.indexOf(x)<0;})[0];
              sl.hero=h;
              sendTo(sl,JSON.stringify({t:'welcome',idx:net.slots.filter(function(s){return s.hero;}).indexOf(sl)+1,hero:h}));
              lobbyBc();
            }else if(m.t==='in'){
              var q=sl.rin;q.l=m.l;q.r=m.r;q.u=m.u;q.d=m.d;q.a=m.a;q.b=m.b;q.c=m.c;q.x=m.x;
              q.pa|=m.pa;q.pb|=m.pb;q.pc|=m.pc;q.px|=m.px;
            }
          }
          function onClose(conn){
            var sl=slotOf(conn);if(!sl)return;
            if(net.running){sl.gone=1;var q=sl.rin;q.l=q.r=q.u=q.d=q.a=q.b=q.c=q.x=q.pa=q.pb=q.pc=q.px=0;}
            else{net.slots.splice(net.slots.indexOf(sl),1);lobbyBc();}
          }
          function hostBegin(){
            var P=srv();
            if(!P){net.msg='HOSTING NEEDS THE APK PLUGIN';return;}
            net.slots=[];net.ip=[];net.hero=ILA.save.party[0];net.lobby=[net.hero];net.msg='STARTING...';
            try{
              P.start(PORT,{
                onFailure:function(){net.msg='SERVER FAILED';},
                onOpen:function(c){onOpen(c);},
                onMessage:function(c,m){onMsg(c,m);},
                onClose:function(c){onClose(c);}
              },function(){
                net.role='host';net.msg='';NS.mode='host';
                try{P.getInterfaces(function(r){var k,a;for(k in r){a=(r[k]&&r[k].ipv4Addresses)||[];a.forEach(function(ip){if(ip.indexOf('127.')!==0&&net.ip.indexOf(ip)<0)net.ip.push(ip);});}});}catch(e){}
              },function(){net.msg='COULD NOT START SERVER';});
            }catch(e){net.msg='SERVER ERROR';}
          }
          function stopHost(){var P=srv();try{if(P)P.stop(function(){});}catch(e){}net.role=null;net.slots=[];net.ip=[];net.running=false;}
          function hostStart(){
            var act=net.slots.filter(function(s){return s.hero&&!s.gone;}),heroes=[net.hero];
            act.forEach(function(s,i){heroes.push(s.hero);sendTo(s,JSON.stringify({t:'welcome',idx:i+1,hero:s.hero}));});
            net.act=act;
            var def=stageDef(net.stage,heroes.length);
            def.onWin=function(){bc({t:'end'});net.running=false;ILA.go(NS);};
            var Sc=ILA.Level(def),oi=Sc.init,ou=Sc.update,tk=0;
            Sc.init=function(a){oi.call(Sc,a);var L=Sc.L;for(var i=1;i<L.pl.length;i++)L.pl[i].remote=net.act[i-1];};
            Sc.update=function(){ou();tk++;if(tk%2===0)bc(snap(Sc.L));};
            net.running=true;
            bc({t:'start',st:net.stage,n:heroes.length});
            ILA.go(Sc,{party:heroes});
          }
          /* ---- guest ---- */
          var gc={p:{},e:{},r:{},k:{}},G=null,acc={pa:0,pb:0,pc:0,px:0},gt=0;
          function sync(c,list,kf,mk,rm){
            var seen={},out=[],i,q,key,o;
            for(i=0;i<list.length;i++){q=list[i];key=kf(q,i);seen[key]=1;o=c[key];
              if(!o){o=c[key]=mk();o.x=q.x;o.y=q.y;o.nw=1;}else o.nw=0;
              o.tx=q.x;o.ty=q.y;out.push([o,q]);}
            for(key in c)if(!seen[key]){if(rm)rm(c[key]);delete c[key];}
            return out;
          }
          function glide(c){for(var k in c){var o=c[k];if(o.tx==null)continue;var dx=o.tx-o.x,dy=o.ty-o.y;if(Math.abs(dx)>90||Math.abs(dy)>90){o.x=o.tx;o.y=o.ty;}else{o.x+=dx*.5;o.y+=dy*.5;}}}
          function apply(m){
            var L=G.L,o,q,pv,out,arr=[];
            L.score=m.sc;L.over=m.o;L.done=m.d;L.goT=m.g;L.lockR=m.lr;L.paused=!!m.pz;
            out=sync(gc.p,m.p,function(q,i){return i;},function(){return {w:14,h:34};});
            out.forEach(function(a){o=a[0];q=a[1];pv=o.hp;
              o.id=q.i;o.dir=q.d;o.hp=q.hp;o.mhp=q.mh;o.en=q.en;o.state=q.s;o.st=q.st;o.t=q.t;o.inv=q.v;o.vx=q.vx;o.vy=q.vy;o.onGround=!!q.g;
              o.at=q.a?{s:q.a[0],t:q.a[1],r:q.a[2]}:null;o.hs=ILA.HS[q.i];
              if(!o.nw&&o.hp<pv){ILA.sfx('hurt');L.pop.push({x:o.x,y:o.y-6,t:0,s:String(pv-o.hp),c:'#ff6a6a'});}
              arr.push(o);});
            if(!arr.length)return;
            var me=arr[net.me]||arr[0];
            L.pl=[me].concat(arr.filter(function(x){return x!==me;}));
            out=sync(gc.e,m.e,function(q){return q.i;},function(){return {};},function(o){ILA.spark(o.x+o.w/2,o.y+o.h/2,12,['#fff','#ffd34a','#ff5a5a'],3,20);});
            L.en=[];
            out.forEach(function(a){o=a[0];q=a[1];pv=o.hp;
              o.t=q.t;o.w=q.w;o.h=q.h;o.vx=q.vx;o.dir=q.d;o.hp=q.hp;o.mhp=q.mh;o.state=q.s;o.st=q.st;o.tt=q.tt;o.fl=q.f;
              o.boss=q.b?1:0;o.bt=q.b||null;o.bd=q.b?ILA.BD[q.b]:null;o.onGround=!!q.og;o.ph2=q.p2;
              if(!o.nw&&o.hp<pv){ILA.sfx('hit');L.pop.push({x:o.x+o.w/2-4,y:o.y-4,t:0,s:String(pv-o.hp),c:'#fff'});ILA.spark(o.x+o.w/2,o.y+o.h/2,6,['#fff','#ffd34a'],2,12);}
              L.en.push(o);});
            out=sync(gc.r,m.r,function(q){return q.i;},function(){return {};});
            L.pr=out.map(function(a){o=a[0];q=a[1];o.w=q.w;o.h=q.h;o.vx=q.vx;o.kind=q.k;o.col=q.c;return o;});
            L.hz=m.z.map(function(z){return {x:z.x,w:z.w,t:z.t,warn:z.wa,live:z.li,col:z.c};});
            out=sync(gc.k,m.k,function(q){return q.i;},function(){return {};});
            L.pk=out.map(function(a){o=a[0];q=a[1];o.k=q.k;o.t=q.t;return o;});
          }
          function gUpdate(){
            var L=G.L,b=ILA.btn,h=ILA.hit,k;if(!L)return;
            acc.pa|=h.a?1:0;acc.pb|=h.b?1:0;acc.pc|=h.c?1:0;acc.px|=h.d?1:0;
            gt++;
            if(gt%2===0&&net.ws&&net.ws.readyState===1){
              net.ws.send(JSON.stringify({t:'in',l:b.left?1:0,r:b.right?1:0,u:b.up?1:0,d:b.down?1:0,a:b.a?1:0,b:b.b?1:0,c:b.c?1:0,x:b.d?1:0,pa:acc.pa,pb:acc.pb,pc:acc.pc,px:acc.px}));
              acc.pa=acc.pb=acc.pc=acc.px=0;
            }
            if(net.snap){var m=net.snap;net.snap=null;apply(m);}
            L.t++;
            glide(gc.p);glide(gc.e);glide(gc.r);glide(gc.k);
            for(k in gc.e)gc.e[k].tt++;for(k in gc.p)gc.p[k].t++;for(k in gc.k)gc.k[k].t++;
            L.pop.forEach(function(q){q.t++;q.y-=.4;});L.pop=L.pop.filter(function(q){return q.t<44;});
            var me=L.pl[0];
            if(me&&me.x!=null){ILA.camFollow(me.x+7,me.y,L.w,L.h);if(L.lockR!=null)ILA.cam.x=Math.min(ILA.cam.x,L.lockR-W);}
          }
          function gStart(st){
            gc={p:{},e:{},r:{},k:{}};acc={pa:0,pb:0,pc:0,px:0};gt=0;net.snap=null;
            G=ILA.Level(stageDef(st,1));G.update=gUpdate;
            net.running=true;ILA.go(G,{party:[net.hero]});
          }
          function gConnect(ip){
            net.msg='CONNECTING...';var done=0,ws;
            try{ws=new WebSocket('ws://'+ip+':'+PORT);}catch(e){net.msg='BAD ADDRESS';return;}
            net.ws=ws;
            var to=setTimeout(function(){if(!done){try{ws.close();}catch(e){}net.msg='NO ANSWER';net.ws=null;}},6000);
            ws.onopen=function(){done=1;clearTimeout(to);net.role='guest';net.hero=ILA.save.party[0];net.msg='';net.lobby=[];ws.send(JSON.stringify({t:'join',hero:net.hero}));NS.mode='wait';};
            ws.onerror=function(){if(!done)net.msg='CONNECTION FAILED';};
            ws.onclose=function(){clearTimeout(to);var was=net.role==='guest';net.role=null;net.ws=null;net.running=false;if(was){net.msg='DISCONNECTED';ILA.go(NS);}else if(!done&&!net.msg)net.msg='CONNECTION FAILED';};
            ws.onmessage=function(ev){
              var m;try{m=JSON.parse(ev.data);}catch(e){return;}
              if(m.t==='welcome'){net.me=m.idx;net.hero=m.hero;}
              else if(m.t==='lobby')net.lobby=m.p;
              else if(m.t==='start')gStart(m.st);
              else if(m.t==='s')net.snap=m;
              else if(m.t==='end'){net.running=false;ILA.go(NS);}
              else if(m.t==='full'){net.msg='HOST IS FULL';try{ws.close();}catch(e){}}
            };
          }
          function askIp(){
            var d=document.createElement('div'),last='';
            try{last=localStorage.getItem('ilarion_ip')||'';}catch(e){}
            d.style.cssText='position:fixed;left:50%;top:22%;transform:translateX(-50%);background:#120c24;border:3px solid #ffcc44;padding:12px;z-index:8;text-align:center;font-family:monospace;color:#fff';
            d.innerHTML='<div style="margin-bottom:8px;font-size:14px;color:#ffcc44">HOST IP</div><input id="ipin" inputmode="decimal" placeholder="192.168.1.5" style="font-size:20px;width:190px;text-align:center;-webkit-user-select:text;user-select:text"><div style="margin-top:10px"><button id="ipgo" style="font-size:16px;padding:6px 14px">JOIN</button> <button id="ipx" style="font-size:16px;padding:6px 14px">X</button></div>';
            document.body.appendChild(d);
            var inp=document.getElementById('ipin');inp.value=last;
            document.getElementById('ipx').onclick=function(){d.remove();};
            document.getElementById('ipgo').onclick=function(){var ip=inp.value.trim();d.remove();if(!ip)return;try{localStorage.setItem('ilarion_ip',ip);}catch(e){}gConnect(ip);};
          }
          /* ---- lobby scene ---- */
          var NS={mode:'menu',sel:0},items=['HOST GAME','JOIN GAME','BACK'];
          NS.init=function(){NS.mode=net.role==='host'?'host':(net.role==='guest'?'wait':'menu');NS.sel=0;};
          NS.update=function(){
            var h=ILA.hit;
            if(NS.mode==='menu'){
              if(h.up){NS.sel=(NS.sel+2)%3;ILA.sfx('sel');}
              if(h.down){NS.sel=(NS.sel+1)%3;ILA.sfx('sel');}
              if(h.b)ILA.go(ILA.scenes.title);
              if(h.a){ILA.sfx('big');net.msg='';if(NS.sel===0)hostBegin();else if(NS.sel===1)askIp();else ILA.go(ILA.scenes.title);}
            }else if(NS.mode==='host'){
              if(h.left){net.stage=(net.stage+3)%4;ILA.sfx('sel');}
              if(h.right){net.stage=(net.stage+1)%4;ILA.sfx('sel');}
              if(h.a){ILA.sfx('big');hostStart();}
              if(h.b){stopHost();NS.mode='menu';}
            }else if(h.b){try{net.ws.close();}catch(e){}}
          };
          NS.draw=function(g){
            var b=S.theme('arcadia'),i;
            g.drawImage(b.sky,0,0);ILA.gfx.parallax(g,b.far,ILA.t*.3,.25,100);
            g.fillStyle='rgba(0,0,0,.62)';g.fillRect(0,0,W,H);
            S.ctr(g,'MULTIPLAYER',10,'#ffd34a',3);
            if(NS.mode==='menu'){
              for(i=0;i<3;i++){var on=i===NS.sel;S.ctr(g,(on?'+ ':'  ')+items[i],80+i*28,on?'#fff':'#9a8ac0',2);}
              S.ctr(g,'SAME WIFI OR HOTSPOT - UP TO 4 PLAYERS',200,'#6a5a90',1);
            }else if(NS.mode==='host'){
              S.ctr(g,'HOSTING - PORT '+PORT,46,'#9fe8ff',1);
              S.ctr(g,net.ip.length?'IP: '+net.ip.join('  /  '):'IP: CHECK YOUR WIFI SETTINGS',62,'#fff',2);
              var l=[net.hero],c;net.slots.forEach(function(s){l.push(s.hero);});
              for(i=0;i<4;i++){c=i<l.length?(l[i]?nm(l[i]):'JOINING...'):'EMPTY';S.ctr(g,'P'+(i+1)+':  '+c,100+i*16,i<l.length?'#ffd34a':'#5a5070',1);}
              S.ctr(g,'STAGE '+(net.stage+1)+'/4:  '+STG[net.stage].n,176,'#fff',2);
              S.ctr(g,'LEFT/RIGHT: STAGE   A: START   B: CLOSE',222,'#9fe8ff',1);
            }else{
              S.ctr(g,'CONNECTED',50,'#7dff9a',2);
              for(i=0;i<4;i++){var h2=net.lobby[i];S.ctr(g,'P'+(i+1)+':  '+(h2?nm(h2):'EMPTY'),96+i*16,h2?'#ffd34a':'#5a5070',1);}
              if((ILA.t>>5)&1)S.ctr(g,'WAITING FOR HOST...',190,'#fff',1);
              S.ctr(g,'B: LEAVE',222,'#9fe8ff',1);
            }
            if(net.msg)S.ctr(g,net.msg,238,'#ff6a6a',1);
          };
          ILA.scenes.net=NS;
          })();
          EOF
      - name: Install Capacitor and plugin
        working-directory: ilarion
        env:
          CI: "true"
        run: |
          npm install
          npm install cordova-plugin-websocket-server || echo "ws plugin skipped"
          npx cap telemetry off || true
          npx cap add android
          npx cap sync android

      - name: Patch manifest
        working-directory: ilarion/android/app/src/main
        run: |
          sed -i 's/<activity\b/<activity android:screenOrientation="sensorLandscape"/' AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/></manifest>#' AndroidManifest.xml

      - name: Build APK
        working-directory: ilarion/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Ilarion-S2-APK
          path: ilarion/android/app/build/outputs/apk/debug/app-debug.apk
