            if(s2==='wind'){an2='atk1';fr2=0;}else if(s2==='hit'){an2='atk1';fr2=e.st<3?1:2;}else if(s2==='rec'){an2='atk1';fr2=2;}
            else if(s2==='stun'){an2='hurt';fr2=0;}else if(s2==='lunge'){an2='jump';fr2=0;}else if(Math.abs(e.vx)<.1){an2='idle';fr2=((e.tt/30)|0)%2;}
            ILA.drawChar(g,'e_'+e.t,an2,fr2,fx,fy,dir,{flash:fl||(s2==='wind'&&((e.st>>2)&1))});
