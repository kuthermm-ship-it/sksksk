            if(e.t==='wraith'){var f2=CB.WRA[((e.tt/8)|0)%3];g.globalAlpha=.88;flip(g,fl?CB.wh(f2):f2,fx,Math.round(e.y-cy-4),dir,-13,0);g.globalAlpha=1;return;}
            shadow(g,fx,fy,e.onGround);
