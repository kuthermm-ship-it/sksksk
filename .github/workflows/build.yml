            {set:{levi:{x:260}},say:[['avian','ليفاي...'],['levi','ماذا؟'],['avian','المرة القادمة... لا تختفِ بدون ما تخبرنا، تمام؟'],['levi','سأحاول.'],['avian','هذا يكفي حالياً.']]},
            {add:[A('origin',380,-1,{alpha:.55,sc:1.6})],dark:.4,sfx:'big',shake:6,say:[['origin','لقد حان وقت العودة.']]},
            {card:'END OF SEASON 2 - THE BLACK THRONE',dark:.85,wait:200}
          ])}
