          function trace(g,segs,w){var pts=[];segs.forEach(function(s){var n=Math.max(Math.abs(s[2]-s[0]),Math.abs(s[3]-s[1]),1);for(var i=0;i<=n;i++){var t=i/n;pts.push([Math.round(s[0]+(s[2]-s[0])*t),Math.round(s[1]+(s[3]-s[1])*t),(s[5]&&t>s[5])?s[6]:s[4]]);}});
            g.fillStyle=O;pts.forEach(function(p){g.fillRect(p[0]-1,p[1]-1,w+2,w+2);});pts.forEach(function(p){g.fillStyle=p[2];g.fillRect(p[0],p[1],w,w);});}
