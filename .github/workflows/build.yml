name: Build Ilarion S2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: P1 - project files
        run: |
          mkdir -p ilarion/www/js
          cd ilarion
          cat > package.json << 'EOF'
          {"name":"ilarion","version":"1.0.0","private":true,
          "dependencies":{"@capacitor/core":"^6.1.0","@capacitor/cli":"^6.1.0","@capacitor/android":"^6.1.0"}}
          EOF
          cat > capacitor.config.json << 'EOF'
          {"appId":"com.ilarion.game","appName":"ILARION","webDir":"www",
          "server":{"androidScheme":"http","cleartext":true}}
          EOF

      - name: P1 - index.html
        run: |
          cat > ilarion/www/index.html << 'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
          <title>ILARION</title>
          <style>
          html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:monospace}
          #wrap{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
          canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
          #pad{position:fixed;left:0;right:0;bottom:0;height:46%;pointer-events:none}
          .b{position:absolute;pointer-events:auto;width:56px;height:56px;border-radius:12px;background:rgba(20,16,40,.55);border:2px solid rgba(255,255,255,.55);color:#fff;font:bold 20px monospace;display:flex;align-items:center;justify-content:center}
          .b.on{background:rgba(255,200,60,.65)}
          #L{left:14px;bottom:44px}#R{left:136px;bottom:44px}#U{left:75px;bottom:100px}#D{left:75px;bottom:-12px}
          #A{right:20px;bottom:50px;width:64px;height:64px;border-radius:32px}
          #B{right:96px;bottom:20px;width:64px;height:64px;border-radius:32px}
          #C{right:20px;bottom:128px;width:56px;height:56px;border-radius:28px}
          #Dd{right:96px;bottom:98px;width:56px;height:56px;border-radius:28px}
          #S{right:14px;top:10px;width:44px;height:30px;font-size:13px;position:fixed}
          #err{position:fixed;left:0;top:0;right:0;color:#f55;background:rgba(0,0,0,.85);font-size:12px;padding:4px;display:none;z-index:9;white-space:pre-wrap}
          </style></head><body>
          <div id="wrap"><canvas id="c" width="480" height="270"></canvas></div>
          <div id="pad">
          <div class="b" id="L" data-k="left">&lt;</div>
          <div class="b" id="R" data-k="right">&gt;</div>
          <div class="b" id="U" data-k="up">^</div>
          <div class="b" id="D" data-k="down">v</div>
          <div class="b" id="A" data-k="a">A</div>
          <div class="b" id="B" data-k="b">B</div>
          <div class="b" id="C" data-k="c">C</div>
          <div class="b" id="Dd" data-k="d">D</div>
          </div>
          <div class="b" id="S" data-k="start">II</div>
          <div id="err"></div>
          <script>
          var ILA = window.ILA = {W:480,H:270,btn:{},hit:{},mods:{},ready:false};
          ILA.cv = document.getElementById('c');
          ILA.ctx = ILA.cv.getContext('2d');
          ILA.ctx.imageSmoothingEnabled = false;
          ILA.fail = function(m){var e=document.getElementById('err');e.style.display='block';e.textContent+=m+'\n';};
          window.onerror = function(m,s,l){ILA.fail(m+' ('+String(s).split('/').pop()+':'+l+')');};
          function fit(){
            var w=innerWidth,h=innerHeight,s=Math.min(w/480,h/270);
            if(s>=1)s=Math.floor(s*4)/4;
            ILA.cv.style.width=(480*s)+'px';ILA.cv.style.height=(270*s)+'px';
          }
          addEventListener('resize',fit);fit();
          function setK(k,v){
            if(v&&!ILA.btn[k])ILA.hit[k]=true;
            ILA.btn[k]=v;
            var el=document.querySelector('[data-k="'+k+'"]');
            if(el)el.classList[v?'add':'remove']('on');
          }
          ILA.endFrame = function(){ILA.hit={};};
          document.querySelectorAll('[data-k]').forEach(function(el){
            var k=el.getAttribute('data-k');
            el.addEventListener('touchstart',function(e){e.preventDefault();setK(k,true);},{passive:false});
            el.addEventListener('touchend',function(e){e.preventDefault();setK(k,false);},{passive:false});
            el.addEventListener('touchcancel',function(){setK(k,false);});
          });
          var KM={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down',j:'a',k:'b',l:'c',i:'d',Enter:'start'};
          addEventListener('keydown',function(e){if(KM[e.key])setK(KM[e.key],true);});
          addEventListener('keyup',function(e){if(KM[e.key])setK(KM[e.key],false);});
          ILA.ctx.fillStyle='#000';ILA.ctx.fillRect(0,0,480,270);
          ILA.ctx.fillStyle='#fc4';ILA.ctx.font='16px monospace';
          ILA.ctx.fillText('ILARION - LOADING...',150,135);
          var files=['core','sprites','combat','story1','story2','net'],i=0;
          function next(){
            if(i>=files.length){
              if(typeof ILA.start==='function'){ILA.ready=true;ILA.start();}
              else ILA.fail('ILA.start missing - paste all 6 parts');
              return;
            }
            var s=document.createElement('script');
            s.src='js/'+files[i]+'.js';
            s.onload=function(){i++;next();};
            s.onerror=function(){ILA.fail('Missing file: js/'+files[i]+'.js (part not pasted?)');i++;next();};
            document.body.appendChild(s);
          }
          next();
          </script>
          </body></html>
          EOF
      - name: P2a - core.js
        run: |
          cat > ilarion/www/js/core.js << 'EOF'
          (function(){
          var ILA=window.ILA,W=ILA.W,H=ILA.H;
          ILA.scenes={};ILA.t=0;ILA.talking=false;ILA.fadeA=0;ILA._fade=null;
          ILA.rnd=function(a,b){return a+Math.random()*(b-a);};
          ILA.clamp=function(v,a,b){return v<a?a:(v>b?b:v);};
          ILA.mk=function(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').imageSmoothingEnabled=false;return c;};
          ILA.R=function(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h);};
          ILA.ov=function(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;};
          function rgb(h){var n=parseInt(h.slice(1),16);return [n>>16,(n>>8)&255,n&255];}
          function srnd(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646;};}
          ILA.srnd=srnd;
          /* ---- pixel font 3x5 (latin) ---- */
          var F={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001001010010','8':'111101111101111','9':'111101111001110',':':'000010000010000','/':'001001010100100','-':'000000111000000','.':'000000000000010','!':'010010010000010','+':'000010111010000'};
          ILA.txt=function(g,s,x,y,c,k){k=k||1;s=String(s).toUpperCase();for(var i=0;i<s.length;i++){var b=F[s[i]];if(b){g.fillStyle=c;for(var j=0;j<15;j++)if(b[j]==='1')g.fillRect(x+(j%3)*k,y+((j/3)|0)*k,k,k);}x+=4*k;}};
          ILA.txtS=function(g,s,x,y,c,k){ILA.txt(g,s,x+(k||1),y+(k||1),'#000',k);ILA.txt(g,s,x,y,c,k);};
          ILA.txtW=function(s,k){return String(s).length*4*(k||1);};
          /* ---- sound (chiptune beeps) ---- */
          var AC=null;
          function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
          function tone(f,d,ty,v,sl){var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain(),n=a.currentTime;o.type=ty||'square';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);g.gain.setValueAtTime(v||.06,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(a.destination);o.start();o.stop(n+d);}
          ILA.sfx=function(n){
            if(n==='hit')tone(160,.12,'sawtooth',.09,-100);
            else if(n==='slash')tone(600,.1,'triangle',.07,-400);
            else if(n==='jump')tone(280,.15,'square',.04,300);
            else if(n==='hurt')tone(220,.25,'sawtooth',.09,-170);
            else if(n==='pick')tone(700,.08,'square',.04,500);
            else if(n==='boom')tone(90,.5,'sawtooth',.12,-60);
            else if(n==='sel')tone(500,.06,'square',.04);
            else if(n==='big')tone(120,.4,'square',.08,200);
          };
          addEventListener('touchstart',function(){var a=ac();if(a&&a.state==='suspended')a.resume();},{passive:true});
          /* ---- particles ---- */
          ILA.fx=[];
          ILA.spark=function(x,y,n,col,sp,life,g){for(var i=0;i<n;i++){var a=Math.random()*6.283,s=ILA.rnd(.3,1)*(sp||2);ILA.fx.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.5,l:life||24,m:life||24,c:Array.isArray(col)?col[(Math.random()*col.length)|0]:col,g:g==null?.08:g,z:Math.random()<.4?2:1});}};
          ILA.fxUpdate=function(){for(var i=ILA.fx.length-1;i>=0;i--){var p=ILA.fx[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;if(--p.l<=0)ILA.fx.splice(i,1);}};
          ILA.fxDraw=function(g,cx,cy){for(var i=0;i<ILA.fx.length;i++){var p=ILA.fx[i];g.globalAlpha=Math.min(1,p.l/(p.m*.5));g.fillStyle=p.c;g.fillRect((p.x-cx)|0,(p.y-cy)|0,p.z,p.z);}g.globalAlpha=1;};
          /* ---- camera ---- */
          ILA.cam={x:0,y:0,sh:0};
          ILA.shake=function(n){ILA.cam.sh=Math.max(ILA.cam.sh,n);};
          ILA.camFollow=function(tx,ty,lw,lh){var c=ILA.cam;c.x+=(tx-W/2-c.x)*.12;c.y+=(ty-H/2-c.y)*.12;c.x=ILA.clamp(c.x,0,Math.max(0,lw-W));c.y=ILA.clamp(c.y,0,Math.max(0,lh-H));};
          ILA.camOff=function(){var c=ILA.cam,s=c.sh;return {x:Math.round(c.x+(s?ILA.rnd(-s,s):0)),y:Math.round(c.y+(s?ILA.rnd(-s,s):0))};};
          /* ---- physics ---- */
          ILA.phys=function(e,S,gr){
            var i,s;e.hitW=false;
            e.vy+=(gr==null?.45:gr);if(e.vy>9)e.vy=9;
            e.x+=e.vx;
            for(i=0;i<S.length;i++){s=S[i];if(s.ow)continue;if(ILA.ov(e,s)){if(e.vx>0)e.x=s.x-e.w;else if(e.vx<0)e.x=s.x+s.w;e.hitW=true;}}
            var py=e.y+e.h;e.y+=e.vy;e.onGround=false;
            for(i=0;i<S.length;i++){s=S[i];if(!ILA.ov(e,s))continue;
              if(s.ow){if(e.vy>=0&&py<=s.y+1&&!e.drop){e.y=s.y-e.h;e.vy=0;e.onGround=true;}}
              else if(e.vy>=0&&py<=s.y+4){e.y=s.y-e.h;e.vy=0;e.onGround=true;}
              else if(e.vy<0){e.y=s.y+s.h;e.vy=0;}
            }
          };
          /* ---- pixel background toolkit ---- */
          var B4=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
          ILA.gfx={};
          ILA.gfx.sky=function(w,h,cols){var c=ILA.mk(w,h),g=c.getContext('2d'),d=g.createImageData(w,h),n=cols.length,rc=cols.map(rgb);
            for(var y=0;y<h;y++){var p=y/h*(n-1),i=Math.min(n-2,p|0),f=p-i;
              for(var x=0;x<w;x++){var t=(B4[y&3][x&3]+.5)/16,q=rc[i+(f>t?1:0)],o=(y*w+x)*4;d.data[o]=q[0];d.data[o+1]=q[1];d.data[o+2]=q[2];d.data[o+3]=255;}}
            g.putImageData(d,0,0);return c;};
          ILA.gfx.stars=function(c,n,seed,col){var g=c.getContext('2d'),r=srnd(seed||5);for(var i=0;i<n;i++){g.fillStyle=r()<.2?'#fff':(col||'#9ab0ff');g.fillRect((r()*c.width)|0,(r()*c.height*.7)|0,1,1);}};
          ILA.gfx.skyline=function(w,h,col,hi,seed,mn,mx,win){var c=ILA.mk(w,h),g=c.getContext('2d'),r=srnd(seed||7),x=0;
            while(x<w){var bw=(12+r()*26)|0,bh=(mn+r()*(mx-mn))|0;g.fillStyle=col;g.fillRect(x,h-bh,bw,bh);g.fillStyle=hi;g.fillRect(x,h-bh,bw,1);
              if(r()<.3){g.fillStyle=col;g.fillRect(x+(bw>>1),h-bh-6,1,6);}
              if(win){for(var yy=h-bh+4;yy<h-3;yy+=5)for(var xx=x+3;xx<x+bw-3;xx+=4)if(r()<.28){g.fillStyle=win;g.fillRect(xx,yy,2,2);}}
              x+=bw+((r()*4)|0);}
            return c;};
          ILA.gfx.hills=function(w,h,col,hi,seed,base,amp){var c=ILA.mk(w,h),g=c.getContext('2d'),r=srnd(seed||3),p1=r()*6,p2=r()*6;
            for(var x=0;x<w;x++){var y=(h-base-(Math.sin(x/37+p1)*amp+Math.sin(x/17+p2)*amp*.4))|0;g.fillStyle=col;g.fillRect(x,y,1,h-y);g.fillStyle=hi;g.fillRect(x,y,1,1);}
            return c;};
          ILA.gfx.tile=function(kind,a,b,c){var t=ILA.mk(16,16),g=t.getContext('2d'),y,r=srnd(11);g.fillStyle=a;g.fillRect(0,0,16,16);
            if(kind==='brick'){g.fillStyle=b;for(y=0;y<16;y+=8){g.fillRect(0,y+7,16,1);var o=(y/8)%2?0:8;g.fillRect(o,y,1,7);g.fillRect((o+8)%16,y,1,7);}g.fillStyle=c;for(y=0;y<16;y+=8)g.fillRect(1,y,14,1);}
            else if(kind==='metal'){g.fillStyle=b;g.fillRect(0,15,16,1);g.fillRect(15,0,1,16);g.fillStyle=c;g.fillRect(0,0,16,1);g.fillRect(0,0,1,16);g.fillStyle=b;g.fillRect(2,2,2,2);g.fillRect(12,2,2,2);g.fillRect(2,12,2,2);g.fillRect(12,12,2,2);}
            else{for(var i=0;i<40;i++){g.fillStyle=r()<.5?b:c;g.fillRect((r()*16)|0,(r()*16)|0,1,1);}}
            return t;};
          ILA.gfx.fill=function(g,tile,x,y,w,h,top){for(var yy=0;yy<h;yy+=16)for(var xx=0;xx<w;xx+=16){var tw=Math.min(16,w-xx),th=Math.min(16,h-yy);g.drawImage(tile,0,0,tw,th,Math.round(x+xx),Math.round(y+yy),tw,th);}
            if(top){g.fillStyle=top;g.fillRect(Math.round(x),Math.round(y),w,2);}};
          ILA.gfx.parallax=function(g,img,camx,f,y){var w=img.width,ox=-((camx*f)%w);if(ox>0)ox-=w;for(var x=ox;x<W;x+=w)g.drawImage(img,Math.round(x),y);};
          /* ---- dialogue (DOM, Arabic) ---- */
          var dlg,dp,dn,dt,dq=[],dc=null,dpos=0,dcb=null,tap=false;
          function mkDlg(){
            dlg=document.createElement('div');
            dlg.style.cssText='position:fixed;left:50%;top:6px;transform:translateX(-50%);width:min(94vw,760px);box-sizing:border-box;background:#120c24;border:3px solid #ffcc44;box-shadow:0 0 0 3px #000,inset 0 0 0 2px #5a3aa0;padding:8px 10px;display:none;z-index:5;direction:rtl;font-family:Tahoma,Arial,sans-serif;color:#fff;min-height:70px;overflow:hidden';
            dlg.innerHTML='<canvas width="16" height="16" style="width:60px;height:60px;image-rendering:pixelated;float:right;margin-left:10px;background:#201840;border:2px solid #ffcc44"></canvas><div style="color:#ffcc44;font-weight:bold;font-size:15px;margin-bottom:3px;min-height:18px"></div><div style="font-size:18px;line-height:1.45;min-height:44px"></div>';
            dp=dlg.children[0];dn=dlg.children[1];dt=dlg.children[2];
            dlg.addEventListener('touchstart',function(e){e.preventDefault();tap=true;},{passive:false});
            dlg.addEventListener('click',function(){tap=true;});
            document.body.appendChild(dlg);
          }
          function nextLine(){
            if(!dq.length){dlg.style.display='none';ILA.talking=false;var f=dcb;dcb=null;ILA.hit={};if(f)f();return;}
            dc=dq.shift();dpos=0;var ch=ILA.chars&&ILA.chars[dc[0]];
            dn.textContent=ch?ch.ar:(dc[2]||'');dp.style.display=ch?'block':'none';
            if(ch)ILA.portrait(dc[0],dp);dt.textContent='';
          }
          ILA.say=function(lines,cb){if(ILA.talking)return;if(!dlg)mkDlg();dq=lines.slice();dcb=cb||null;ILA.talking=true;dlg.style.display='block';tap=false;nextLine();};
          function dlgUpdate(){
            if(!ILA.talking)return;
            var len=dc[1].length;
            if(dpos<len){dpos+=1;dt.textContent=dc[1].slice(0,dpos|0);}
            if(ILA.hit.a||ILA.hit.b||ILA.hit.start||tap){tap=false;ILA.hit={};if(dpos<len){dpos=len;dt.textContent=dc[1];}else nextLine();}
          }
          ILA.banner=function(ar,en,ms){var d=document.createElement('div');ms=ms||2200;
            d.style.cssText='position:fixed;left:0;right:0;top:34%;text-align:center;z-index:6;pointer-events:none;color:#fff;text-shadow:3px 3px 0 #000,-1px -1px 0 #000;font-family:Tahoma,Arial,sans-serif;transition:opacity .6s';
            d.innerHTML='<div style="font:bold 14px monospace;color:#ffcc44;letter-spacing:4px">'+en+'</div><div style="font-size:30px;font-weight:bold;margin-top:4px">'+ar+'</div>';
            document.body.appendChild(d);setTimeout(function(){d.style.opacity=0;},ms);setTimeout(function(){d.remove();},ms+700);};
          /* ---- scenes, fade, main loop ---- */
          ILA.fadeTo=function(cb){ILA._fade={d:1,cb:cb};};
          ILA.go=function(s,a){ILA.fadeTo(function(){ILA.scene=s;if(s.init)s.init(a);});};
          function step(){
            ILA.t++;
            var f=ILA._fade;
            if(f){if(f.d>0){ILA.fadeA+=.08;if(ILA.fadeA>=1){ILA.fadeA=1;if(f.cb)f.cb();f.d=-1;}}else{ILA.fadeA-=.08;if(ILA.fadeA<=0){ILA.fadeA=0;ILA._fade=null;}}}
            dlgUpdate();
            var s=ILA.scene;
            if(s&&s.update&&!ILA.talking&&!(ILA._fade&&ILA._fade.d>0))s.update();
            ILA.fxUpdate();
            if(ILA.cam.sh>0)ILA.cam.sh=Math.max(0,ILA.cam.sh-.4);
            ILA.endFrame();
          }
          function draw(){
            var g=ILA.ctx;g.fillStyle='#000';g.fillRect(0,0,W,H);
            if(ILA.scene&&ILA.scene.draw)ILA.scene.draw(g);
            if(ILA.fadeA>0){g.fillStyle='rgba(0,0,0,'+ILA.fadeA+')';g.fillRect(0,0,W,H);}
          }
          var last=0,acc=0;
          function loop(ts){requestAnimationFrame(loop);var dt=Math.min(100,ts-last);last=ts;acc+=dt;while(acc>=16.667){acc-=16.667;step();}draw();}
          ILA.start=function(){
            var s=ILA.scenes.title;
            if(!s){ILA.fail('title scene missing');return;}
            ILA.scene=s;if(s.init)s.init();
            requestAnimationFrame(loop);
          };
          })();
          EOF
      - name: P2b - sprites.js
        run: |
          cat > ilarion/www/js/sprites.js << 'EOF'
          (function(){
          var ILA=window.ILA,O='#140c1c',CW=72,CHH=52,OX=8,OY=12;
          var HEAD=["..oooooo..",".ohhHHhho.","ohhhHhhhho","ohhhhhhhso","ohhgssssso","ohgsssseso","ohgsssssso",".osssssSo.","..ossSSo..","...oooo..."];
          var TORSO=["..oooooo..",".ocCcccco.","occCcccdco","occCcaccdo","occccccddo","otttttttto",".oppppppo."];
          var DP={s:'#f2cfa8',S:'#d3a07a',h:'#444',H:'#666',g:'#222',c:'#444',C:'#666',d:'#222',p:'#333',q:'#222',b:'#222',B:'#333',t:'#777',e:'#111',a:'#fc4'};
          var CH={};
