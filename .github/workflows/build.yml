              else{p.vx*=.8;if(t===12)fireSpec(L,p);if(t>=34)p.state='idle';}}
            else{
              var mv=(inp.r?1:0)-(inp.l?1:0);
              if(mv){p.dir=mv;p.vx+=(mv*p.spd-p.vx)*.35;}else p.vx*=.72;
              if(inp.pb&&(p.onGround||p.coy>0)){
                if(inp.d&&p.onGround&&onOW(L,p)){p.dropT=10;p.y+=2;}
                else{p.vy=-p.jmp;p.onGround=false;p.coy=0;ILA.sfx('jump');ILA.spark(p.x+7,p.y+p.h,4,'#ccc',1,12,.02);}}
              if(!inp.b&&p.vy<-3.2)p.vy+=.55;
              if(inp.pa)startAtk(p,0);
              else if(inp.pc&&p.en>=hs.sp.cost)startSpec(L,p);
              else if(inp.px&&p.dcd<=0){p.state='dash';p.st=0;p.dcd=34;p.inv=Math.max(p.inv,12);ILA.sfx('slash');}}
            if(p.dropT>0){p.dropT--;p.drop=true;}else p.drop=false;
            ILA.phys(p,L.S);
            if(p.onGround){p.coy=6;if(p.t%30===0&&p.state!=='hurt'){p.safe=p.safe2;p.safe2={x:p.x,y:p.y};}}else if(p.coy>0)p.coy--;
            if(p.x<0)p.x=0;
            var mx=(L.lockR!=null)?L.lockR-p.w:L.w-p.w;if(p.x>mx)p.x=mx;
            if(L.arenaL!=null&&L.bossActive&&p.x<L.arenaL)p.x=L.arenaL;
            if(p.y>L.h+30){hurtP(L,p,12,1);if(p.state!=='dead'){p.x=p.safe.x;p.y=p.safe.y-6;p.vx=0;p.vy=0;p.state='idle';p.inv=70;}else{p.y=L.h-10;}}
          }
          ILA._pl={pUpdate:pUpdate,aiInput:aiInput,eUpdate:eUpdate,nearest:nearest};
