            else if(sp.t==='nova'){L.en.forEach(function(e){if(e.rm||e.state==='dying')return;if(Math.abs(e.x+e.w/2-cx)<95&&Math.abs(e.y-p.y)<80){hurtE(L,e,sp.dmg,e.x>p.x?1:-1,3);L.hz.push({x:e.x+e.w/2-6,w:12,t:0,warn:0,live:10,dmg:0,col:'#7fe4ff',hit:[]});}});ILA.spark(cx,cy,34,['#7fe4ff','#fff','#ffd34a'],4,26);ILA.shake(4);}
            else if(sp.t==='heal'){L.pl.forEach(function(q){if(q.state==='dead')return;q.hp=Math.min(q.mhp,q.hp+Math.round(q.mhp*.3));pop(L,q.x,q.y-8,'+HP','#7dff9a');ILA.spark(q.x+7,q.y+18,14,['#7dff9a','#ffeaa0','#fff'],2,26,-.02);});
              L.en.forEach(function(e){if(!e.rm&&e.state!=='dying'&&Math.abs(e.x-cx)<60)hurtE(L,e,sp.dmg,e.x>p.x?1:-1,2);});}
            else if(sp.t==='blast'){L.pr.push({x:p.dir>0?p.x+p.w:p.x-36,y:p.y-2,w:36,h:36,vx:p.dir*3.2,vy:0,dmg:sp.dmg,own:'p',life:90,pierce:1,col:col,kind:'blast',hit:[],nc:1});ILA.shake(3);}
            else if(sp.t==='slam'){L.en.forEach(function(e){if(!e.rm&&e.state!=='dying'&&Math.abs(e.x+e.w/2-cx)<95&&Math.abs(e.y-p.y)<50)hurtE(L,e,sp.dmg,e.x>p.x?1:-1,5);});
              for(var k=-1;k<=1;k+=2)L.pr.push({x:cx-8,y:p.y+p.h-10,w:16,h:10,vx:k*3,vy:0,dmg:sp.dmg*.6,own:'p',life:34,pierce:1,col:'#ffcf6a',kind:'shock',hit:[],nc:1});
              ILA.shake(9);ILA.sfx('boom');ILA.spark(cx,p.y+p.h,24,['#ffcf6a','#aaa','#fff'],3.5,24);}
          }
          function onOW(L,p){for(var i=0;i<L.S.length;i++){var s=L.S[i];if(s.ow&&Math.abs(s.y-(p.y+p.h))<2&&p.x+p.w>s.x&&p.x<s.x+s.w)return true;}return false;}
          function pUpdate(L,p,inp){
            p.t++;
            if(p.state==='dead'){p.vx*=.92;ILA.phys(p,L.S);return;}
            if(p.inv>0)p.inv--;if(p.dcd>0)p.dcd--;
            p.en=Math.min(100,p.en+.035);
            var hs=p.hs,s=p.state;
