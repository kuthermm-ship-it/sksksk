            else if(s==='dash'){p.st++;p.vx=p.dir*5.6;p.vy=0;if(p.st>11){p.state='idle';p.vx*=.3;}ILA.spark(p.x+p.w/2,p.y+p.h-6,1,'#fff',.4,10,0);}
            else if(s==='atk'){
              var a=p.at;a.t++;if(inp.pa)a.buf=true;
              var last=a.s===hs.rate.length-1;
              if(a.t===a.r){ILA.sfx('slash');p.vx=p.dir*(last?2.6:1.5);
                if(hs.ranged)L.pr.push({x:p.dir>0?p.x+p.w:p.x-10,y:p.y+12,w:10,h:6,vx:p.dir*4.8,vy:0,dmg:hs.dmg*(last?1.8:1),own:'p',life:45,pierce:last?1:0,col:HC[p.id],kind:'bolt',hit:[],nc:0});}
              if(!hs.ranged&&a.t>=a.r&&a.t<a.r*2){
                var box={x:p.dir>0?p.x+p.w-2:p.x-hs.reach+2,y:p.y-2,w:hs.reach,h:p.h+4};
                L.en.forEach(function(e){if(e.rm||e.state==='dying'||a.hit.indexOf(e)>=0)return;if(ILA.ov(box,e)){a.hit.push(e);p.en=Math.min(100,p.en+4);hurtE(L,e,hs.dmg*(last?1.6:1),p.dir,last?4:2);}});}
              p.vx*=.86;
              if(a.t>=a.r*3){if(a.buf&&a.s+1<hs.rate.length)startAtk(p,a.s+1);else{p.state='idle';p.at=null;}}}
            else if(s==='spec'){
              p.st++;var sp=hs.sp,t=p.st;
              if(sp.t==='dashthru'){
                if(t>=6&&t<22){p.vx=p.dir*9;p.vy=0;p.inv=Math.max(p.inv,3);ILA.spark(p.x+7,p.y+16,2,['#fff','#9a9aff'],.8,12,0);
                  L.en.forEach(function(e){if(e.rm||e.state==='dying'||p.hl.indexOf(e)>=0)return;if(ILA.ov(p,e)){p.hl.push(e);hurtE(L,e,sp.dmg,p.dir,3);}});}
                else if(t<6)p.vx=0;else p.vx*=.5;
